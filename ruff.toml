# Standalone, so this folder can be copied out on its own.
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["N803", "N806"]  # sklearn-style X / y names

[lint.isort]
known-first-party = ["app", "train_mushroom"]

[lint.per-file-ignores]
"notebooks/*" = ["E402"]  # imports come after the sys.path line that finds app/
